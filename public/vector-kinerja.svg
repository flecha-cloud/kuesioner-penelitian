<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="Anak muda menunjukkan hasil kerja">
<style>.chart{transform-box:fill-box;transform-origin:bottom center;animation:grow .8s cubic-bezier(.2,.8,.2,1) infinite alternate}.arm{transform-box:fill-box;transform-origin:top center;animation:present 1s ease-in-out infinite alternate}.spark{animation:spark 1.2s ease-in-out infinite alternate}@keyframes grow{to{transform:scaleY(1.12)}}@keyframes present{to{transform:rotate(8deg)}}@keyframes spark{to{opacity:.2;transform:scale(.7)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Karakter tetap diam; hanya tangan dan grafik yang bergerak tipis. */
.arm{transform-box:fill-box;transform-origin:top center;animation:present-soft 2.8s ease-in-out infinite alternate!important}
.chart{transform-box:fill-box;transform-origin:bottom center;animation:chart-breathe 3.2s ease-in-out infinite alternate!important}
.spark{animation:soft-twinkle 2.6s ease-in-out infinite alternate!important}
@keyframes present-soft{to{transform:rotate(2.2deg)}}
@keyframes chart-breathe{to{transform:scaleY(1.025)}}
@keyframes soft-twinkle{to{opacity:.4;transform:scale(.9)}}

</style>
