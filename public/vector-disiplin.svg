<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><style>
    .arm-wave,.arm-write,.arm-point,.arm-celebrate,.legs,.body,.paper,.typing,.bulb,.chart,.conf{transform-box:fill-box;transform-origin:center;}
    .arm-wave{animation:wave 1.15s ease-in-out infinite alternate} .arm-write{animation:write .42s ease-in-out infinite alternate} .arm-point{animation:point 1.8s ease-in-out infinite} .arm-celebrate{animation:yay .75s cubic-bezier(.2,.8,.2,1) infinite alternate}
    .legs{animation:step 1.15s ease-in-out infinite alternate} .body{animation:breathe 2.1s ease-in-out infinite} .paper{animation:paper .8s ease-in-out infinite alternate} .typing{animation:type .28s ease-in-out infinite alternate} .bulb{animation:glow 1.4s ease-in-out infinite alternate} .chart{animation:chart .9s ease-in-out infinite alternate} .conf{animation:conf 1.3s ease-in-out infinite alternate}
    @keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(17deg)}} @keyframes write{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(8deg) translateY(4px)}} @keyframes point{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(8deg)}} @keyframes yay{from{transform:rotate(-12deg) translateY(4px)}to{transform:rotate(13deg) translateY(-9px)}} @keyframes step{from{transform:translateX(-3px) rotate(-1deg)}to{transform:translateX(4px) rotate(1deg)}} @keyframes breathe{50%{transform:translateY(-3px)}} @keyframes paper{to{transform:translateY(5px) rotate(2deg)}} @keyframes type{to{transform:translateY(3px)}} @keyframes glow{to{transform:scale(1.08)}} @keyframes chart{to{transform:translateY(-5px) rotate(1deg)}} @keyframes conf{to{transform:translateY(-14px) rotate(9deg)}}
