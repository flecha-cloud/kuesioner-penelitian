<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="Dua anak muda memperkenalkan diri">
<style>.arm{transform-box:fill-box;transform-origin:top center;animation:hello .8s ease-in-out infinite alternate}.body{transform-box:fill-box;transform-origin:center;animation:bob 2s ease-in-out infinite}.card{animation:card .9s ease-in-out infinite alternate}.star{animation:star 1.4s ease-in-out infinite alternate}@keyframes hello{to{transform:rotate(20deg)}}@keyframes bob{50%{transform:translateY(-7px) rotate(1deg)}}@keyframes card{to{transform:rotate(5deg) translateY(-5px)}}@keyframes star{to{opacity:.2;transform:scale(.7)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Karakter diam; gerak hanya pada tangan dan aksen kecil. */
.body{animation:none!important;transform:none!important}
.arm{transform-box:fill-box;transform-origin:top center;animation:micro-wave 2.8s ease-in-out infinite alternate!important}
.card{animation:micro-card 3.2s ease-in-out infinite alternate!important}
.star{animation:soft-twinkle 2.5s ease-in-out infinite alternate!important}
@keyframes micro-wave{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3deg)}}
@keyframes micro-card{to{transform:rotate(1.2deg)}}
@keyframes soft-twinkle{to{opacity:.45;transform:scale(.9)}}

</style>
