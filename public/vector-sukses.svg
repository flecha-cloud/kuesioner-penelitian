<style>.jump{transform-box:fill-box;transform-origin:center bottom;animation:jump .68s cubic-bezier(.2,.8,.2,1) infinite alternate}.arm{transform-box:fill-box;transform-origin:top center;animation:yay .55s ease-in-out infinite alternate}.conf{animation:fall 1.5s ease-in-out infinite}.conf:nth-of-type(2n){animation-delay:-.7s}@keyframes jump{to{transform:translateY(-35px) rotate(-3deg)}}@keyframes yay{to{transform:rotate(24deg)}}@keyframes fall{from{transform:translateY(-35px) rotate(0);opacity:1}to{transform:translateY(70px) rotate(110deg);opacity:.15}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
